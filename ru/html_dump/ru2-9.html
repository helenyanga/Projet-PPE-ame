https://leonardo.osnova.io/2087be84-2a57-5815-b95c-163b2ad0c3db/-/scale_crop/72x72/-/format/webp/ 2x" type="image/webp"><img src="https://leonardo.osnova.io/2087be84-2a57-5815-b95c-163b2ad0c3db/-/scale_crop/72x72/" srcset="https://leonardo.osnova.io/2087be84-2a57-5815-b95c-163b2ad0c3db/-/scale_crop/72x72/, https://leonardo.osnova.io/2087be84-2a57-5815-b95c-163b2ad0c3db/-/scale_crop/72x72/ 2x" alt loading="lazy"></picture><!--]--></div><!--]--></a><div class="author__main"><a class="author__name" href="/id3945789" data-router-link data-link-preview="subsite" data-link-preview-source="Post"><!--[-->Вера Атара<!--]--></a><!----><!--[--><!--]--></div><div class="author__details"><!--[--><a class="content-header__topic" href="/opinions" data-router-link data-link-preview="subsite" data-link-preview-source="Post"><!--[-->Мнения<!--]--></a><div class="string-switch noshrink" style="height:18px;"><div class="content-header__date"><a class="noshrink" href="/opinions/1672265-chto-takoe-duh-i-chto-takoe-dusha" data-router-link><!--[--><time title="25.11.2024 в 14:31" datetime="2024-11-25T11:31:53.000Z">25.11.2024</time><!--]--></a><!----></div></div><!--]--></div></div><div class="content-header__actions"><!----></div></div><!----><div class="content__body"><h1 class="content-title content-title--low-indent"><span>Что такое ДУХ и что такое ДУША? <!----></span></h1><!----><article class="content__blocks"><!--[--><figure class="block-wrapper block-wrapper--default"><div class="block-wrapper__content"><!--[--><!----><div class="block-text"><p>Дух для меня — это источник всего сущего, бесконечная энергия, из которой рождается жизнь и к которой всё возвращается. Это высшее сознание, чистая искра божественного, которая существует за пределами времени, пространства и любых изменений.</p></div><!--]--></div><!----></figure><figure class="block-wrapper block-wrapper--default"><div class="block-wrapper__content"><!--[--><!----><div class="block-text"><p>Дух — это абсолютное "Я есть", суть, которая пронизывает всё, соединяет нас с великим целым и напоминает о нашем единстве с Вселенной.</p></div><!--]--></div><!----></figure><figure class="block-wrapper block-wrapper--default"><div class="block-wrapper__content"><!--[--><!----><div class="block-text"><p>Но Дух для меня это не только о вечности и единстве, это ещё и про силу действовать, совершать поступки и воплощать свои намерения в реальность. Это внутренний стержень, который помогает двигаться вперёд, даже в самые тёмные и сложные времена.</p></div><!--]--></div><!----></figure><figure class="block-wrapper block-wrapper--default"><div class="block-wrapper__content"><!--[--><!----><div class="block-text"><p>Дух это энергия, которая даёт вдохновение и смелость идти за своим предназначением, преодолевать страхи и сомнения, делать выбор и влиять на свою жизнь. Это огонь внутри, который не только освещает путь, но и побуждает идти по нему, шаг за шагом.</p></div><!--]--></div><!----></figure><figure class="block-wrapper block-wrapper--default"><div class="block-wrapper__content"><!--[--><!----><div class="block-text"><p>Душа, в свою очередь, — это путешественница, это то, что проживает, чувствует, осознаёт. Если Дух — это вечная, неподвижная истина, то Душа её воплощение в движении и времени. Душа это уникальная энергия, которая несёт в себе опыт, мудрость и уроки каждой прожитой жизни. Это голос сердца, который шепчет о смысле и глубине, помогает чувствовать и проживать жизнь во всей её полноте через радость, боль, любовь и преображение.</p></div><!--]--></div><!----></figure><figure class="block-wrapper block-wrapper--default"><div class="block-wrapper__content"><!--[--><!--[--><!--]--><div class="block-text"><p>Душа для меня — это связь с внутренним миром, с эмоциями и истинами, которые формируются в процессе её развития. Дух — это её основа, первозданный свет, который даёт силы и вдохновение, а Душа — это её движение, её выражение в каждом мгновении.</p></div><!--]--></div><!----></figure><figure class="block-wrapper block-wrapper--default"><div class="block-wrapper__content"><!--[--><!----><div class="block-text"><p>Вместе Дух и Душа создают целостность. Дух задаёт направление и даёт силу действовать, а Душа наполняет путь чувствами, смыслами и проживанием. Дух — это вечный огонь, который горит внутри, а Душа — это тот, кто несёт этот огонь сквозь все свои воплощения, оставляя за собой свет и тепло.</p></div><!--]--></div><!----></figure><figure class="block-wrapper block-wrapper--media"><div class="block-wrapper__content"><!--[--><!----><div class="block-delimiter"></div><!--]--></div><!----></figure><figure class="block-wrapper block-wrapper--default"><div class="block-wrapper__content"><!--[--><!----><div class="block-text"><p>Ещё больше полезного и важного про психологию, самопознание, отношения и законы Вселенной — в моём Telegram-канале. Подписывайтесь!</p></div><!--]--></div><!----></figure><figure class="block-wrapper block-wrapper--media"><div class="block-wrapper__content"><!--[--><!----><div class="block-link"><a class="andropov-link" href="https://api.vc.ru/v2.8/redirect?to=https%3A%2F%2Ft.me%2F%2520BYNvRKsPmdU2Y2Iy&amp;postId=1672265"><div class="andropov-link__image"><div data-loaded="true" class="andropov-media andropov-media--bordered andropov-media--has-preview andropov-link__icon andropov-image andropov-link__icon" style="aspect-ratio:1;width:36px;height:36px;max-width:none;--background-color:#26a5e4;"><!----><!--[--><picture><source srcset="https://leonardo.osnova.io/0c5ec522-6456-5837-a7a9-efa6a12645d2/-/scale_crop/72x72/-/format/webp/, https://leonardo.osnova.io/0c5ec522-6456-5837-a7a9-efa6a12645d2/-/scale_crop/72x72/-/format/webp/ 2x" type="image/webp"><img src="https://leonardo.osnova.io/0c5ec522-6456-5837-a7a9-efa6a12645d2/-/scale_crop/72x72/" srcset="https://leonardo.osnova.io/0c5ec522-6456-5837-a7a9-efa6a12645d2/-/scale_crop/72x72/, https://leonardo.osnova.io/0c5ec522-6456-5837-a7a9-efa6a12645d2/-/scale_crop/72x72/ 2x" alt loading ,"data":{"text":"\u003Cp\u003EДух для меня — это источник всего сущего, бесконечная энергия, из которой рождается жизнь и к которой всё возвращается. Это высшее сознание, чистая искра божественного, которая существует за пределами времени, пространства и любых изменений.\u003C/p\u003E"}},{"type":"text","cover":false,"hidden":false,"anchor":"","data":{"text":"\u003Cp\u003EДух — это абсолютное \"Я есть\", суть, которая пронизывает всё, соединяет нас с великим целым и напоминает о нашем единстве с Вселенной.\u003C/p\u003E"}},{"type":"text","cover":false,"hidden":false,"anchor":"","data":{"text":"\u003Cp\u003EНо Дух для меня это не только о вечности и единстве, это ещё и про силу действовать, совершать поступки и воплощать свои намерения в реальность. Это внутренний стержень, который помогает двигаться вперёд, даже в самые тёмные и сложные времена.\u003C/p\u003E"}},{"type":"text","cover":false,"hidden":false,"anchor":"","data":{"text":"\u003Cp\u003EДух это энергия, которая даёт вдохновение и смелость идти за своим предназначением, преодолевать страхи и сомнения, делать выбор и влиять на свою жизнь. Это огонь внутри, который не только освещает путь, но и побуждает идти по нему, шаг за шагом.\u003C/p\u003E"}},{"type":"text","cover":false,"hidden":false,"anchor":"","data":{"text":"\u003Cp\u003EДуша, в свою очередь, — это путешественница, это то, что проживает, чувствует, осознаёт. Если Дух — это вечная, неподвижная истина, то Душа её воплощение в движении и времени. Душа это уникальная энергия, которая несёт в себе опыт, мудрость и уроки каждой прожитой жизни. Это голос сердца, который шепчет о смысле и глубине, помогает чувствовать и проживать жизнь во всей её полноте через радость, боль, любовь и преображение.\u003C/p\u003E"}},{"type":"text","cover":false,"hidden":false,"anchor":"","data":{"text":"\u003Cp\u003EДуша для меня — это связь с внутренним миром, с эмоциями и истинами, которые формируются в процессе её развития. Дух — это её основа, первозданный свет, который даёт силы и вдохновение, а Душа — это её движение, её выражение в каждом мгновении.\u003C/p\u003E"}},{"type":"text","cover":false,"hidden":false,"anchor":"","data":{"text":"\u003Cp\u003EВместе Дух и Душа создают целостность. Дух задаёт направление и даёт силу действовать, а Душа наполняет путь чувствами, смыслами и проживанием. Дух — это вечный огонь, который горит внутри, а Душа — это тот, кто несёт этот огонь сквозь все свои воплощения, оставляя за собой свет и тепло.\u003C/p\u003E"}},{"type":"delimiter","cover":false,"hidden":false,"anchor":"","data":{"type":"default"}},{"type":"text","cover":false,"hidden":false,"anchor":"","data":{"text":"\u003Cp\u003EЕщё больше полезного и важного про психологию, самопознание, отношения и законы Вселенной — в моём Telegram-канале. Подписывайтесь!\u003C/p\u003E"}},{"type":"link","cover":false,"hidden":false,"anchor":"","data":{"link":{"type":"link","data":{"url":"https://api.vc.ru/v2.8/redirect?to=https%3A%2F%2Ft.me%2F%2520BYNvRKsPmdU2Y2Iy&postId=1672265","title":"С Верой Хлопкофф по Жизни","description":"https://t.me/+h2udQ76yEJQ5MzZi Ты здесь не просто так! Когда ты в этом пространстве, с тобой случается жизнь и чудеса. Стань Творцом. 🔥События Веры: https://verakhlopkoff.ru/taplinknew Регистрация в РКН по заявке №4779968409","image":{"type":"image","data":{"uuid":"0c5ec522-6456-5837-a7a9-efa6a12645d2","width":180,"height":180,"size":4016,"type":"png","color":"26a5e4","hash":"","external_service":[]}},"v":1,"hostname":"t.me"}}}},{"type":"text","cover":false,"hidden":false,"anchor":"","data":{"text":"\u003Cp\u003E\u003Ci\u003EЯ благодарю вас за то, что были со мной сегодня.\u003C/i\u003E\u003C/p\u003E"}},{"type":"text","cover":false,"hidden":false,"anchor":"","data":{"text":"\u003Cp\u003E\u003Ci\u003EС любовью, Вера 🧡\u003C/i\u003E\u003C/p\u003E"}}],"summaryContent":null,"isExistSummaryContent":false,"warningFromEditor":null,"warningFromEditorTitle":null,"counters":{"comments":0,"favorites":0,"reposts":0,"views":123,"hits":149,"r <script type="application/ld+json" data-hid="schema-org-graph">{"@context":"https://schema.org","@graph":[{"@id":"https://vc.ru#breadcrumb","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","name":"Мнения","item":"https://vc.ru/opinions","position":1}]},{"@id":"https://vc.ru/#/post","@type":"Article","dateModified":"2024-11-25T11:31:53.000Z","datePublished":"2024-11-25T11:31:53.000Z","description":"Дух для меня — это источник всего сущего, бесконечная энергия, из которой рождается жизнь и к которой всё возвращается. Это высшее сознание, чистая искра божественного, которая существует за пределами времени, пространства и любых изменений.","headline":"Что такое ДУХ и что такое ДУША? — Мнения на vc.ru","inLanguage":"ru","text":"Дух для меня — это источник всего сущего, бесконечная энергия, из которой рождается жизнь и к которой всё возвращается. Это высшее сознание, чистая искра божественного, которая существует за пределами времени, пространства и любых изменений. Дух — это абсолютное \"Я есть\", суть, которая пронизывает всё, соединяет нас с великим целым и напоминает о нашем единстве с Вселенной. Но Дух для меня это не только о вечности и единстве, это ещё и про силу действовать, совершать поступки и воплощать свои намерения в реальность. Это внутренний стержень, который помогает двигаться вперёд, даже в самые тёмные и сложные времена. Дух это энергия, которая даёт вдохновение и смелость идти за своим предназначением, преодолевать страхи и сомнения, делать выбор и влиять на свою жизнь. Это огонь внутри, который не только освещает путь, но и побуждает идти по нему, шаг за шагом. Душа, в свою очередь, — это путешественница, это то, что проживает, чувствует, осознаёт. Если Дух — это вечная, неподвижная истина, то Душа её воплощение в движении и времени. Душа это уникальная энергия, которая несёт в себе опыт, мудрость и уроки каждой прожитой жизни. Это голос сердца, который шепчет о смысле и глубине, помогает чувствовать и проживать жизнь во всей её полноте через радость, боль, любовь и преображение. Душа для меня — это связь с внутренним миром, с эмоциями и истинами, которые формируются в процессе её развития. Дух — это её основа, первозданный свет, который даёт силы и вдохновение, а Душа — это её движение, её выражение в каждом мгновении. Вместе Дух и Душа создают целостность. Дух задаёт направление и даёт силу действовать, а Душа наполняет путь чувствами, смыслами и проживанием. Дух — это вечный огонь, который горит внутри, а Душа — это тот, кто несёт этот огонь сквозь все свои воплощения, оставляя за собой свет и тепло. Ещё больше полезного и важного про психологию, самопознание, отношения и законы Вселенной — в моём Telegram-канале. Подписывайтесь! Я благодарю вас за то, что были со мной сегодня. С любовью, Вера 🧡 ","url":"https://vc.ru/opinions/1672265-chto-takoe-duh-i-chto-takoe-dusha","about":{"name":"ArticleUGC"},"author":{"@type":"Person","name":"Вера Атара","image":"https://leonardo.osnova.io/b8e7ba45-35eb-5060-a734-1f5ae1deef4a/-/scale_crop/144x/","url":"https://vc.ru/id3945789"},"image":{"@type":"ImageObject","url":"https://api.vc.ru/v2.9/cover/fb/c/1672265/1767557156/cover.jpg"},"keywords":[]}]}</script></body>
